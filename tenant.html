<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaaSBase | 租户后台</title>
    <style>
      :root {
        --bg: #f7f9fc;
        --surface: #ffffff;
        --border: #dbe3f0;
        --text: #132033;
        --muted: #5c6d85;
        --brand: #3f6fe0;
        --radius: 18px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(180deg, #fbfcfe 0%, var(--bg) 100%);
        color: var(--text);
      }
      .shell {
        max-width: 1120px;
        margin: 0 auto;
        padding: 32px 24px 64px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 40px;
      }
      a {
        color: var(--brand);
        text-decoration: none;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
      }
      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 24px;
        align-items: start;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: rgba(255,255,255,0.92);
        box-shadow: 0 16px 40px rgba(19, 32, 51, 0.06);
      }
      .main {
        padding: 32px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(36px, 4vw, 56px);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.75;
        font-size: 16px;
      }
      .panel {
        padding: 24px;
      }
      .list {
        display: grid;
        gap: 14px;
        margin-top: 20px;
      }
      .item {
        padding: 16px;
        border-radius: 14px;
        background: #f8fbff;
        border: 1px solid #e6eef8;
      }
      .item strong { display: block; margin-bottom: 6px; }
      @media (max-width: 900px) {
        .hero { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <strong>SaaSBase / 租户后台</strong>
        <a class="button" href="./index.html">返回首页</a>
      </header>

      <section class="hero">
        <div class="card main">
          <h1>租户级管理入口</h1>
          <p>
            这里是租户管理员的工作区，后续可承载成员管理、部门组织、文件管理和常用设置。
          </p>
        </div>

        <aside class="card panel">
          <strong>当前页面</strong>
          <div class="list">
            <div class="item">
              <strong>成员管理</strong>
              <span>维护用户与角色分配。</span>
            </div>
            <div class="item">
              <strong>组织结构</strong>
              <span>管理部门、成员和权限范围。</span>
            </div>
            <div class="item">
              <strong>文件空间</strong>
              <span>查看、上传和管理租户文件。</span>
            </div>
          </div>
        </aside>
      </section>
    </div>
  </body>
</html>
